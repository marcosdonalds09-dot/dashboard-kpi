function setAt(mi,mf,btn){document.getElementById('fMi').value=mi;document.getElementById('fMf').value=mf;document.querySelectorAll('.at').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}
function limpAt(){document.querySelectorAll('.at').forEach(b=>b.classList.remove('on'));}
function filtrar(){const ls=sel('fL'),ks=sel('fK'),grp=document.getElementById('fG').value;let mi=+document.getElementById('fMi').value,mf=+document.getElementById('fMf').value;if(mi&&mf&&mf<mi){let z=mi;mi=mf;mf=z;}const ano=+document.getElementById('fA').value;return{ls,ks,grp,mi,mf,ano};}
function desenhaG(i){
  const kObj=G_ATUAL[i];if(!kObj||!CTX)return;const {f,dFilt,lojas,mesesIdx,multiMes,perT}=CTX;
  const cId='cG'+i;const hm=kObj.m!==null;const ord=ords[kObj.k]||'melhor';const modo=multiMes?(modos[kObj.k]||'mes'):'per';
  const pares=lojas.map(l=>{const row=dFilt.find(x=>x.l===l&&x.k===kObj.k);return{l,row,v:row?vPer(row,f):null};});
  const asc=(kObj.s==='menor')===(ord==='melhor');
  const sorted=[...pares].sort((a,b)=>{if(a.v===null&&b.v===null)return 0;if(a.v===null)return 1;if(b.v===null)return -1;return asc?a.v-b.v:b.v-a.v;});
  const val=sorted.filter(x=>x.v!==null);const best=[...val].sort((a,b)=>kObj.s==='menor'?a.v-b.v:b.v-a.v);
  const rot=sorted.map(x=>x.v===null?x.l:(best.indexOf(x)+1)+'\u00ba '+x.l);
  const gs=document.getElementById('gs'+i);if(gs)gs.innerHTML=best.length>1?`&#9650; Melhor: <b>${best[0].l}</b> (${fmtV(best[0].v,kObj.f)}) &nbsp;&middot;&nbsp; &#9660; Aten&ccedil;&atilde;o: <b>${best[best.length-1].l}</b> (${fmtV(best[best.length-1].v,kObj.f)})${multiMes?' &nbsp;&middot;&nbsp; '+perT:''}`:'';
  const tLine=tends[kObj.k]?[{type:'line',label:'Tend\u00eancia'+(multiMes?' ('+perT+')':''),data:sorted.map(x=>x.v),borderColor:TH.tend,backgroundColor:TH.tend,borderWidth:2.5,tension:0.4,cubicInterpolationMode:'monotone',pointRadius:3,pointHoverRadius:5,spanGaps:true,fill:false,order:0}]:[];
  const lblT=ctx=>ctx.dataset.type==='line'?ctx.dataset.label+': '+fmtV(ctx.raw,kObj.f):null;
  if(modo==='mes'){
    const ds=mesesIdx.map((mi,ci)=>({label:MC[P[mi].m],data:sorted.map(x=>x.row?vMes(x.row,mi):null),backgroundColor:CORES_MES[ci%CORES_MES.length],borderRadius:3,order:1})).concat(tLine);
    mkChart(cId,'bar',rot,ds,{plugins:{legend:{display:true,position:'top',labels:{boxWidth:8,color:TH.tx,font:{size:9}}},tooltip:{callbacks:{label:ctx=>lblT(ctx)||ctx.dataset.label+': '+fmtV(ctx.raw,kObj.f),footer:it=>{const x=sorted[it[0].dataIndex];return x&&x.v!==null?perT+': '+fmtV(x.v,kObj.f):'';}}}},scales:{x:{grid:{color:TH.grid},ticks:{color:TH.tx,font:{size:9}}},y:{grid:{color:TH.grid},ticks:{color:TH.ty,callback:v=>fmtV(v,kObj.f)}}}});
  } else {
    mkChart(cId,'bar',rot,[{label:perT,data:sorted.map(x=>x.v),backgroundColor:sorted.map(x=>corH(ating(x.v,kObj.m,kObj.s),hm,x.v)),borderRadius:4,order:1}].concat(tLine),{plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>lblT(ctx)||(multiMes?perT+': ':'')+fmtV(ctx.raw,kObj.f)}}},scales:{x:{grid:{color:TH.grid},ticks:{color:TH.tx,font:{size:9}}},y:{grid:{color:TH.grid},ticks:{color:TH.ty,callback:v=>fmtV(v,kObj.f)}}}});
  }
}
function aplicaTema(c){document.body.classList.toggle('claro',c);TH=c?TEMAS.claro:TEMAS.escuro;document.getElementById('btnTema').innerHTML=c?'&#11035; Fundo preto':'&#11036; Fundo branco';}
function trocaTema(){const c=!document.body.classList.contains('claro');aplicaTema(c);try{localStorage.setItem('kpiTema',c?'claro':'escuro');}catch(e){}render();}
function imprimir(){Object.values(CH).forEach(c=>c.resize());setTimeout(()=>window.print(),300);}
window.addEventListener('beforeprint',()=>Object.values(CH).forEach(c=>c.resize()));
window.addEventListener('afterprint',()=>Object.values(CH).forEach(c=>c.resize()));
function render(){
  const f=filtrar();
  if(!f.mi)f.mi=1;if(!f.mf)f.mf=12;
  const kAll=[...new Map(D.map(x=>[x.k,x])).values()].sort((a,b)=>a.o-b.o);
  let kpis=f.ks.length?kAll.filter(x=>f.ks.includes(x.k)):f.grp?kAll.filter(x=>x.g===f.grp):kAll;
  const dFilt=D.filter(x=>(!f.ls.length||f.ls.includes(x.l)));
  const lojas=[...new Set(dFilt.map(x=>x.l))].sort();
  const mesesIdx=[];for(let m=f.mi;m<=f.mf;m++){const i=idxP(f.ano,m);if(i>=0)mesesIdx.push(i);}f.idx=mesesIdx;
  const multiMes=mesesIdx.length>1;
  const perT=MC[f.mi]+(f.mi!==f.mf?' a '+MC[f.mf]:'')+' '+f.ano;
  const lojT=f.ls.length?f.ls.join(', '):'Todas as lojas';
  const txt=lojT+' \u2022 '+perT+(f.grp?' \u2022 '+f.grp:'')+(segAt?' \u2022 '+segAt:'');
  document.getElementById('pbar').textContent=txt;
  document.getElementById('pSel').textContent=txt;
  let tags='';if(segAt)tags+=`<span class='stag'>&#128205; ${segAt}</span>`;if(f.grp)tags+=`<span class='gtag'>${f.grp}</span>`;
  if(!mesesIdx.length)tags+=`<span class='stag' style='background:#3a1a1a;color:#f87171'>&#128197; Sem dados na base para ${perT}</span>`;
  document.getElementById('tags').innerHTML=tags;
  const kCards=f.grp||f.ks.length?kpis:kpis.filter(k=>k.m!==null);
  document.getElementById('kgrid').innerHTML=kCards.map(kpi=>{
    const vals=dFilt.filter(x=>x.k===kpi.k).map(x=>vPer(x,f)).filter(v=>v!==null);
    const tot=CARD_TOT.has(kpi.o);const v=vals.length?(tot?vals.reduce((a,b)=>a+b,0):med(vals)):null;const at=ating(v,kpi.m,kpi.s);const hm=kpi.m!==null;const cl=cor3(at,hm,v);
    const tag=lojas.length>1?`<div class='kag'>${tot?'Total das lojas':'M\u00e9dia por loja'}</div>`:'';
    return`<div class='kc ${cl}'><div class='kt'>${kpi.k}</div>${tag}<div class='kv'>${fmtV(v,kpi.f)}</div><div class='km'>Meta: ${hm?fmtV(kpi.m,kpi.f):'-'}</div></div>`;
  }).join('')||'<div style="padding:8px;color:#444">Nenhum KPI no grupo.</div>';
  const colsR=kpis.slice(0,6);
  const pLoja=lojas.map(l=>{const d=dFilt.filter(x=>x.l===l);const kv=colsR.map(kpi=>{const row=d.find(x=>x.k===kpi.k);const v=row?vPer(row,f):null;return{kpi,v,at:ating(v,kpi.m,kpi.s)};});const ats=kv.filter(x=>x.kpi.m!==null).map(x=>x.at).filter(x=>x!==null);return{l,kv,atG:ats.length?med(ats):null};}).sort((a,b)=>(b.atG??-99)-(a.atG??-99));
  document.getElementById('thR').innerHTML='<tr><th>Loja</th>'+colsR.map(k=>`<th title='${k.k}'>${nomeCurto(k.k)}</th>`).join('')+'</tr>';
  document.getElementById('tbR').innerHTML=pLoja.map(r=>{const kc=r.kv.map(kv=>{const hm=kv.kpi.m!==null;return`<td><span class='bol ${cor3(kv.at,hm,kv.v)}-b'></span>${fmtV(kv.v,kv.kpi.f)}</td>`;}).join('');return`<tr><td>${r.l}</td>${kc}</tr>`;}).join('')||'<tr><td colspan=8 style="color:#444">Sem dados</td></tr>';
  const gKpis=kCards;G_ATUAL=gKpis;
  const nG=gKpis.length;
  const cont=document.getElementById('grafCont');
  cont.className='s-graf '+(nG===1?'g1':nG===2?'g2':'g3');
  const sig=gKpis.map(k=>k.k).join('#')+'|'+multiMes;
  if(cont.dataset.sig!==sig){
    Object.keys(CH).filter(id=>id.indexOf('cG')===0).forEach(id=>{CH[id].destroy();delete CH[id];});
    cont.innerHTML=gKpis.map((k,i)=>{const o=ords[k.k]||'melhor',md=modos[k.k]||'mes';const bModo=multiMes?`<span class='grp'><button class='ord-btn ${md==='mes'?'on':''}' onclick='setModo(${i},"mes",this)'>M&ecirc;s a m&ecirc;s</button><button class='ord-btn ${md==='per'?'on':''}' onclick='setModo(${i},"per",this)'>Per&iacute;odo</button></span>`:'';return`<div class='card'><h3><span>${k.k.split('|')[0].trim()}</span><span class='ctl'>${bModo}<span class='grp'><button class='ord-btn ${tends[k.k]?'on':''}' onclick='setTend(${i},this)' title='Mostrar/ocultar linha de tend&ecirc;ncia'>&#128200; Tend&ecirc;ncia</button></span><span class='grp'><button class='ord-btn ${o==='melhor'?'on':''}' onclick='setOrd(${i},"melhor",this)'>&#9650; Melhor</button><button class='ord-btn ${o==='pior'?'on':''}' onclick='setOrd(${i},"pior",this)'>&#9660; Aten&ccedil;&atilde;o</button></span></span></h3><div class='gsub' id='gs${i}'></div><div class='cht'><canvas id='cG${i}'></canvas></div></div>`;}).join('');
    cont.dataset.sig=sig;
  }
  CTX={f,dFilt,lojas,mesesIdx,multiMes,perT};
  gKpis.forEach((k,i)=>desenhaG(i));
}
function limpar(){segAt=null;ords={};modos={};tends={};document.getElementById('grafCont').dataset.sig='';document.querySelectorAll('.sb,.at').forEach(b=>b.classList.remove('on'));['fL','fK'].forEach(id=>[...document.getElementById(id).options].forEach(o=>o.selected=false));periodoPadrao();document.getElementById('fG').value='';render();}
Chart.defaults.font.family='Segoe UI,Arial,sans-serif';Chart.defaults.font.size=10;
try{if(localStorage.getItem('kpiTema')==='claro')aplicaTema(true);}catch(e){}
init();
</script></body></html>
